<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defenders - Game Versions</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0 20px; /* Added padding to the sides */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1, h2 {
            margin: 10px 0;
        }
        h1 {
            color: #007acc;
        }
        h2 {
            color: #555;
        }
        .container {
            text-align: center;
        }
        .section {
            margin-bottom: 30px;
        }
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .button-grid a {
            display: inline-block;
            text-decoration: none;
            color: #007acc;
            font-weight: bold;
            border: 2px solid #007acc;
            border-radius: 5px;
            padding: 10px 20px;
            transition: all 0.3s ease;
            transform-origin: center;
        }
        .button-grid a:hover {
            background-color: #007acc;
            color: #fff;
            transform: scale(1.2); /* Bigger hover effect */
        }
        .current-version {
            border: 2px solid #ff6347;
            color: #ff6347;
            font-size: 32px; /* Larger font size for PLAY button */
            padding: 30px 50px; /* More padding for PLAY button */
            background-color: #fff5f5;
        }
        .current-version:hover {
            background-color: #ff6347;
            color: #fff;
        }
        .version-text {
            font-size: 12px;
            color: #ff6347;
            margin-top: 5px;
        }
        .error-message {
            position: absolute;
            bottom: 20px;
            background-color: rgba(255, 0, 0, 0.6); /* Translucent red */
            color: #ff0000; /* Darker red font */
            padding: 10px;
            border: 2px solid #990000; /* Darker red outline */
            border-radius: 5px;
            display: none;
            transition: opacity 0.5s ease; /* Fast fade-in, slow fade-out */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tower Defenders</h1>
        
        <div class="section">
            <h2>Current Version</h2>
            <div class="button-grid">
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Beta-v5.0.1/index.html" class="current-version">PLAY</a>
            </div>
            <div class="version-text">Beta v5.0.1 (Current)</div>
        </div>
        
        <div class="section">
            <h2>Historical Versions</h2>
            <div class="button-grid">
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.0/index.html">Alpha v2.0</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.1/index.html">Alpha v2.1</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.3/index.html">Alpha v2.3</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.4/index.html">Alpha v2.4</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.5.1/index.html">Alpha v2.5.1</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.7.0/index.html">Alpha v2.7.0</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.7.2/index.html">Alpha v2.7.2</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v2.8.0/index.html">Alpha v2.8.0</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v4.0/index.html">Alpha v4.0</a>
                <a href="https://raw.githack.com/Tebby2008/TowerDefenders/TowerDefenders-Alpha-v4.1.0/index.html">Alpha v4.1.0</a>
                <a href="#" id="prebetaButton">PreBeta v5.0</a>
            </div>
        </div>
    </div>
    
    <div class="error-message" id="errorMessage">Error: PreBeta v5.0 is currently unavailable.</div>
    
    <script>
        const prebetaButton = document.getElementById('prebetaButton');
        const errorMessage = document.getElementById('errorMessage');

        prebetaButton.addEventListener('click', (e) => {
            e.preventDefault();
            errorMessage.style.display = 'block';
            errorMessage.style.opacity = '1';
            setTimeout(() => {
                errorMessage.style.opacity = '0';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 500); // Ensure the display:none is set after fade-out
            }, 2000); // Show message for 2 seconds before fading out
        });
    </script>
</body>
</html>
